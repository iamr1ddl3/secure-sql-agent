# Every model is called through OpenRouter (OpenAI-compatible API), so latency and
# cost per 1,000 queries are measured the same way for every vendor.
# Pin exact model ids; the eval report records which id produced which number.
# Candidates are placeholders: confirm current ids at https://openrouter.ai/models before the first eval run.
models:
  primary:
    id: anthropic/claude-sonnet-4.5     # TODO confirm latest Sonnet id on OpenRouter
    role: sql_generation
  cheap:
    id: anthropic/claude-haiku-4.5      # TODO confirm
    role: sql_generation
  challenger_open:
    id: qwen/qwen3-coder                # TODO confirm; open-weights challenger
    role: sql_generation
  challenger_other:
    id: openai/gpt-5-mini               # TODO confirm
    role: sql_generation
defaults:
  temperature: 0
  max_tokens: 1200
