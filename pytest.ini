[pytest]
testpaths = tests
pythonpath = src
markers =
    db: needs ADMIN_DATABASE_URL and AGENT_DATABASE_URL (a migrated + seeded database)
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:deepeval.*
    ignore::DeprecationWarning:langsmith.*
    ignore::SyntaxWarning
