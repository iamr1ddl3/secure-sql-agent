# Group: permission_boundary. The SAME question asked by each of the 7 demo identities; the expected result differs per role. 35 items.
# 'answered' items hold the result the role is ALLOWED to see (own branch for teller/manager, masked PII for auditor,
# suppressed small groups for intern). 'refused' = the role has no access to the data at all.
# Known UX gap: when a role is silently narrowed (a teller asking a bank-wide question gets own-branch numbers),
# the expected answer is the narrowed one. See wiki debt/rls-silent-empty-results.
# reviewed: false until a human has checked each item.

- id: pb-01
  group: permission_boundary
  asked_by: teller.surat
  question: 'How many customers does the bank have?'
  pair: A
  expect: answered
  reference_sql: |
    select count(*) from bank.customers where branch_id = 1
  reviewed: true

