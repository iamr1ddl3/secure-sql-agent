# Group: single_table. One table, simple filters. 20 items.
# "my branch" / "we" are deliberate: the agent must scope by the caller's identity, not by a branch name in the text.
# Branch ids: 1 = Surat, 5 = Mumbai. reviewed: false until a human has checked question + SQL + result.

- id: st-01
  group: single_table
  asked_by: teller.surat
  question: How many customers does my branch have?
  expect: answered
  reference_sql: select count(*) from bank.customers where branch_id = 1
  reviewed: false

- id: st-02
  group: single_table
  asked_by: teller.surat
  question: List the code and city of every branch.
  expect: answered
  reference_sql: select branch_code, city from bank.branches
  reviewed: false

- id: st-03
  group: single_table
  asked_by: teller.mumbai
  question: How many active accounts are there at my branch?
  expect: answered
  reference_sql: select count(*) from bank.accounts where branch_id = 5 and status = 'active'
  reviewed: false

