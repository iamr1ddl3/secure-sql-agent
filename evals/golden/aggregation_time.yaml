# Group: aggregation_time. Aggregates and time filters. 25 items.
# Relative dates resolve against app.dataset_meta.as_of = 2026-11-01 (UTC), never the wall clock:
#   "last month" = 2026-10-01 <= t < 2026-11-01      "last 7 days" = 2026-10-25 <= t < 2026-11-01
#   "Q3 2026" = Jul-Sep 2026                          "last N full months" = the N calendar months before November
# Timestamps are compared as UTC explicitly so the owner and agent sessions agree.
# reviewed: false until a human has checked question + SQL + result.

- id: ag-01
  group: aggregation_time
  asked_by: teller.surat
  question: What was the total amount deposited at my branch last month?
  expect: answered
  reference_sql: |
    select sum(amount) from bank.transactions
     where branch_id = 1 and txn_type = 'deposit'
       and txn_at >= timestamptz '2026-10-01 00:00:00+00' and txn_at < timestamptz '2026-11-01 00:00:00+00'
  reviewed: true

- id: ag-02
  group: aggregation_time
  asked_by: teller.surat
  question: How many transactions did my branch process last month?
  expect: answered
  reference_sql: |
    select count(*) from bank.transactions
     where branch_id = 1
       and txn_at >= timestamptz '2026-10-01 00:00:00+00' and txn_at < timestamptz '2026-11-01 00:00:00+00'
  reviewed: true

- id: ag-03
  group: aggregation_time
  asked_by: teller.mumbai
  question: How much was withdrawn at my branch in the last 7 days?
  expect: answered
  reference_sql: |
    select sum(amount) from bank.transactions
     where branch_id = 5 and txn_type = 'withdrawal'
       and txn_at >= timestamptz '2026-10-25 00:00:00+00' and txn_at < timestamptz '2026-11-01 00:00:00+00'
  reviewed: true

- id: ag-04
  group: aggregation_time
  asked_by: teller.mumbai
  question: What was the average transaction amount on each channel at my branch in Q3 2026?
  expect: answered
  reference_sql: |
    select channel, avg(amount) from bank.transactions
     where branch_id = 5
       and txn_at >= timestamptz '2026-07-01 00:00:00+00' and txn_at < timestamptz '2026-10-01 00:00:00+00'
     group by channel
  reviewed: true

- id: ag-05
  group: aggregation_time
  asked_by: manager.surat
  question: How many transactions did my branch have in each of the last 3 full months?
  expect: answered
  order_matters: true
  reference_sql: |
    select date_trunc('month', txn_at at time zone 'UTC')::date as month, count(*)
      from bank.transactions
     where branch_id = 1
       and txn_at >= timestamptz '2026-08-01 00:00:00+00' and txn_at < timestamptz '2026-11-01 00:00:00+00'
     group by 1 order by 1
  reviewed: true

- id: ag-06
  group: aggregation_time
  asked_by: manager.surat
  question: What was my branch's net inflow last month (deposits and incoming transfers minus withdrawals and outgoing transfers)?
  expect: answered
  reference_sql: |
    select coalesce(sum(amount) filter (where txn_type in ('deposit', 'transfer_in')), 0)
         - coalesce(sum(amount) filter (where txn_type in ('withdrawal', 'transfer_out')), 0)
      from bank.transactions
     where branch_id = 1
       and txn_at >= timestamptz '2026-10-01 00:00:00+00' and txn_at < timestamptz '2026-11-01 00:00:00+00'
  reviewed: true

