- id: ag-17
  group: aggregation_time
  asked_by: auditor
  question: Which 3 branches had the highest total transaction amount last month? Show branch name and total.
  expect: answered
  order_matters: true
  reference_sql: |
    select b.name, sum(t.amount) as total
      from bank.transactions t join bank.branches b on b.branch_id = t.branch_id
     where t.txn_at >= timestamptz '2026-10-01 00:00:00+00' and t.txn_at < timestamptz '2026-11-01 00:00:00+00'
     group by b.name order by total desc, b.name limit 3
  reviewed: true

