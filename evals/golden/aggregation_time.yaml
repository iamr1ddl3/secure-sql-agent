- id: ag-10
  group: aggregation_time
  asked_by: manager.surat
  question: How much principal has my branch disbursed in each year?
  expect: answered
  order_matters: true
  reference_sql: |
    select extract(year from disbursed_on)::int as year, sum(principal)
      from bank.loans where branch_id = 1 group by 1 order by 1
  reviewed: true

- id: ag-11
  group: aggregation_time
  asked_by: hr.officer
  question: How many employees were hired in each year?
  expect: answered
  order_matters: true
  reference_sql: |
    select extract(year from hired_on)::int as year, count(*) from bank.employees group by 1 order by 1
  reviewed: true

- id: ag-12
  group: aggregation_time
  asked_by: hr.officer
  question: What is the average current annual CTC across all active employees?
  expect: answered
  reference_sql: |
    select avg(s.annual_ctc)
      from bank.employees e join bank.salaries s on s.employee_id = e.employee_id
     where e.status = 'active'
       and s.effective_from = (select max(s2.effective_from) from bank.salaries s2 where s2.employee_id = e.employee_id)
  reviewed: true

