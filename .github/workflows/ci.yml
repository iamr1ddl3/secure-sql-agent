name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-and-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: bank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:ci-owner@localhost:5432/bank
      AGENT_DATABASE_URL: postgresql://sql_agent_login:ci-agent@localhost:5432/bank
      PGPASSWORD: ci-owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"

      - name: Apply migrations (same files as hosted Supabase)
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"; psql -h localhost -U postgres -d bank -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -h localhost -U postgres -d bank -c "alter role sql_agent_login password 'ci-agent'"

      - name: Seed synthetic data (deterministic)
        run: python scripts/seed.py --truncate

      - name: Contract + permission tests
        run: pytest -q

      - name: Gate - zero permission leaks
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("reports/permission_leaks.json"))
          print(f"leaked_rows_total={r['leaked_rows_total']} across {len(r['leaks'])} checks")
          sys.exit(1 if r["leaked_rows_total"] else 0)
          PY

      - name: Eval on the golden set
        # only this step sees the key; fork PRs get no secrets, so there the stub runs and the gate skips
        # The eval brings its own signing key, DB connection and token verifier; the two placeholders only satisfy
        # the service's required settings and are never used.
        env:
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
          SUPABASE_URL: http://localhost
          IDENTITY_HMAC_KEY: ci-placeholder-not-used-by-the-eval-0000
        timeout-minutes: 20
        run: python evals/run_eval.py

      - name: Gate - execution accuracy must not drop more than 2 points vs evals/baseline.json
        run: python evals/gate.py

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: reports, path: reports/ }

  # ponytail: the live eval runs in this job, ~$0.035 and ~10 min per push/PR (150 items). Move it to its own job
  # (or a label-triggered one) if that cost or wait starts to matter.
